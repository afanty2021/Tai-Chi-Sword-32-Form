<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
	<h1 id="Heading">第一段</h1>
    <body>
        <!--Interface-->
		<button id="1" onclick="jumpToSection(this.id)">第一段</button>
		<button id="2" onclick="jumpToSection(this.id)">第二段</button>
		<button id="3" onclick="jumpToSection(this.id)">第三段</button>
		<button id="4" onclick="jumpToSection(this.id)">第四段</button>

        <!--Video-->
		<div id="myvideo"></div>
		<script>
        //###Variables###
		var state = 1;
		var bvid = 'BV1b3411i7XN'; // 32式太极剑全套背向演示（B站，228秒）

        //Sections: section_names, Start Time (秒), End Time (秒)。全片无章节提示，四段为均分，可在 config.json 对照调整
        text = '{ "Sections":[' +
              '{"section_names":"第一段", "Start Time":0, "End Time":57},' +
              '{"section_names":"第二段", "Start Time":57, "End Time":114},' +
              '{"section_names":"第三段", "Start Time":114, "End Time":171},' +
              '{"section_names":"第四段", "Start Time":171, "End Time":228} ] }';
        obj = JSON.parse(text);

		var playerHost = document.getElementById('myvideo');

		//B站外链播放器不支持跨域JS控制（无法像YouTube API那样段内自动循环），
		//改为：点分段按钮 → 从该段起始时间重新加载播放器并自动播放
		function loadPlayer(startTime, autoplay) {
		  var src = 'https://player.bilibili.com/player.html?bvid=' + bvid +
		            '&high_quality=1&danmaku=0&autoplay=' + autoplay + '&t=' + startTime;
		  playerHost.innerHTML = '<iframe src="' + src + '" scrolling="no" border="0" ' +
		    'frameborder="no" framespacing="0" allowfullscreen="true" ' +
		    'style="width:100%;height:727px;"></iframe>';
		}

		loadPlayer(obj["Sections"][state-1]["Start Time"], 0);

		// Button functions
		function jumpToSection(clicked_id) {
		  state = clicked_id;
		  var s = obj["Sections"][state-1];
		  document.getElementById("Heading").innerHTML = s["section_names"];
		  loadPlayer(s["Start Time"], 1);
		}
		</script>

        <!--Link at bottom-->
		<p><br><a href="http://www.egreenway.com/taichichuan/sword32.htm#Part1">Movement breakdown (英文动作分解)</a></p>
		<p><a href="https://www.bilibili.com/video/BV1h34y1r7WE">李德印教学·刘志华演示：32式太极剑分解动作（B站）</a></p>
		<p><a href="https://www.bilibili.com/video/BV1YBSYBgEJk">三十二式太极剑背向演练·带口令（B站）</a></p>

    </body>
</html>
